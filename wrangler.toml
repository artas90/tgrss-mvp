name = "telegram-rss-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# ---------------------------------------------------------------------------
# Public configuration (safe to commit).
# ---------------------------------------------------------------------------
[vars]
# Predefined feed key. Callers must present it via ?key=, X-API-Key or Bearer.
# Prefer `wrangler secret put API_KEY` for production values.
API_KEY = "change-me"
# Shared secret for the Telegram webhook path + X-Telegram-Bot-Api-Secret-Token.
# Prefer `wrangler secret put WEBHOOK_SECRET`.
WEBHOOK_SECRET = "change-me-webhook"
# Number of posts kept per channel in KV.
# 1000 comfortably covers a 30-day window even for very active channels.
MAX_POSTS = "5000"
# Retention window: the feed only exposes posts from the last N days.
FEED_DAYS = "30"
# Browser/CDN cache lifetime for feeds, in seconds.
CACHE_TTL = "300"
# How long a stored post lives in KV, in days.
POST_TTL_DAYS = "30"
# Set to "0" to skip Bot API media resolution.
RESOLVE_MEDIA = "1"

# ---------------------------------------------------------------------------
# Secrets (set with `wrangler secret put <NAME>` — do NOT commit values):
#   BOT_TOKEN       token from @BotFather, needed for webhook ingest + media
#   API_KEY         the predefined feed key
#   WEBHOOK_SECRET  webhook path/header secret
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# KV namespace holding the harvested posts.
# Create with:  npx wrangler kv namespace create CHANNEL_KV
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CHANNEL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

[observability]
enabled = true
